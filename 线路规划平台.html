/* ============================================================
 * v6.9.1 液态玻璃设计 token（全项目元素的设计基础与核心）
 * 新增/修改任何卡片、按钮、浮层元素前，先按此配方设计玻璃效果。
 * L1 浮层玻璃用「暗调玻璃」：浅色底图上玻璃片清晰可感（白.10 在浅底上不可见），
 *    白字/白边框在暗调上可读；依然清透（blur 6px 柔而不雾）。
 * L2 内容玻璃 —— 弹窗/表单载体（白底 + 高透过 blur，可读性优先）
 * L3 主页卡片 —— 壁纸大卡（JS 折射 _lgApply + 受光，见 .home-card）
 * 卫星等深色底图用 .sat-active/.map-dark 暗玻璃变体（已有体系）。
 * 禁止：重磨砂(>8px 于 L1)、色块底、彩色/深蓝投影、文字阴影。
 * ============================================================ */
:root {
  --glass-bg: rgba(255,255,255,.08);             /* L1 暗调玻璃底（浅底图上可见） */
  --glass-bg-hover: rgba(255,255,255,.16);
  --glass-border: rgba(255,255,255,.32);      /* 细白边框 */
  --glass-hi: rgba(255,255,255,.40);          /* 顶缘高光线 */
  --glass-hi-soft: rgba(255,255,255,.20);     /* 顶内侧柔光带 */
  --glass-lo: rgba(255,255,255,.12);          /* 下缘次高光 */
  --glass-shadow: 0 4px 16px rgba(0,0,0,.06); /* 极淡中性托影 */
  --glass-blur: blur(1px);                    /* L1 小件柔化（极轻） */
  --glass-blur-panel: blur(8px);             /* 面板/弹窗级柔化 */
  --glass-blur-content: blur(8px);           /* L2 内容玻璃柔化 */
  --glass-content-bg: rgba(255,255,255,.10);  /* L2 白底 */
}
.info-panel {

/* v6.12 首页↔路线页上滑转场（View Transitions API，不支持的浏览器直接切换） */

html::view-transition-old(root) { animation: 750ms cubic-bezier(.22,.61,.36,1) both vt-out; }
html::view-transition-new(root) { animation: 750ms cubic-bezier(.22,.61,.36,1) both vt-in; }
html.vt-back::view-transition-old(root) { animation: 750ms cubic-bezier(.22,.61,.36,1) both vt-back-out; }
html.vt-back::view-transition-new(root) { animation: 750ms cubic-bezier(.22,.61,.36,1) both vt-back-in; }
@keyframes vt-out { to { transform: translateY(-100%); } }
@keyframes vt-in { from { transform: translateY(100%); } }
@keyframes vt-back-out { to { transform: translateY(100%); } }
@keyframes vt-back-in { from { transform: translateY(-100%); } }
@media (prefers-reduced-motion: reduce) {
  html::view-transition-old(root), html::view-transition-new(root),
  html.vt-back::view-transition-old(root), html.vt-back::view-transition-new(root) { animation: none !important; }
}

/* ========== 主页（四季画廊 · 液态玻璃） ========== */
/* 背景：壁纸打底不可滑动（滚动只发生在卡片层），整张壁纸无任何叠加效果直接展示 */
#homeMask {
  position: fixed; inset: 0; z-index: 2400; overflow: hidden;
  background: linear-gradient(180deg, #dfe9f4 0%, #eef2f7 100%);
}
.home-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .55s ease; }
.home-head {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5001;
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 26px 34px 0;
}
.home-title .brand-logo {
  display: block; width: 260px; height: auto; filter: drop-shadow(0 2px 12px rgba(10,40,100,.28));
}
.home-title h1 {
  margin: 0; font-size: 34px; font-weight: 700; letter-spacing: 6px; color: #fff;
  text-shadow: 0 2px 18px rgba(30,60,110,.45), 0 1px 2px rgba(30,60,110,.35);
}
.home-title .sub {
  display: block; margin-top: 6px; font-size: 10.5px; letter-spacing: 3.5px;
  color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(30,60,110,.5);
}
.home-tools { display: flex; gap: 8px; }
.home-tools button {
  border: 1px solid var(--glass-border); border-radius: 999px; padding: 8px 16px; cursor: pointer;
  font-size: 12.5px; font-weight: 600; color: #fff; letter-spacing: .5px;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo), var(--glass-shadow);
  transition: background .18s, transform .18s;
}
.home-tools button:hover { background: var(--glass-bg-hover); transform: translateY(-1px); }
/* 卡片滚动层：容器顶缘=渐隐终点线（12%）。v6.14 节奏重排：顶部垫层 28vh+46 → 14vh+12
   （首板块头从视口 ~45% 提到 ~27%，消除 logo 下大片留白）、板块间距 34→48px、
   底部收尾 140px → 20vh+16px（尾板块下方留出与顶部对称的壁纸呼吸区，滚到底不贴边）；
   出场渐隐带 24% → 12%（上滑约一半距离即完全隐藏），入场=底部固定渐隐带见 applyHomeFade（v6.15） */
.home-scroll {
  position: absolute; left: 0; right: 0; top: 12%; bottom: 2%; z-index: 4;
  overflow-y: auto; padding: calc(14vh + 12px) 34px calc(20vh + 16px); scrollbar-width: none;
}
.home-scroll::-webkit-scrollbar { display: none; }
.season { margin: 0 0 48px; } /* v6.14: 34 → 48px，板块节奏更均匀 */
/* v6.7 试版：季节头文字改白（与壁纸协调），去 emoji 图标；无文字阴影，纯液态玻璃质感 */
.season-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; color: rgba(255,255,255,.96); }
.season-head .nm { font-size: 19px; font-weight: 700; letter-spacing: 2px; }
.season-head .nm i {
  font-style: normal; font-size: 10.5px; font-weight: 600; letter-spacing: 2.5px;
  color: rgba(255,255,255,.72); margin-left: 8px; text-transform: uppercase;
}
.season-head .cnt {
  font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,.85);

/* v6.8.1 清透 + 液态玻璃光学：无磨砂无折射，纯透明玻璃 + 边缘光感（上亮下暗的受光细节） */
.home-card {
  width: 340px; box-sizing: border-box;
  background: rgba(255,255,255,.05); border-radius: 22px; padding: 24px 22px 20px;
  cursor: pointer; border: 1px solid rgba(255,255,255,.30);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.38),
    inset 0 -1px 0 rgba(255,255,255,.10),

}

    inset 0 1px 0 rgba(255,255,255,.42),

.home-card .nm { font-size: 16px; font-weight: 500; color: rgba(255,255,255,.85); margin: 0 0 5px; letter-spacing: .5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-card .meta { font-size: 12px; color: rgba(255,255,255,.6); margin: 0; font-weight: 400; letter-spacing: .5px; }
.season-empty {

  border: 1px dashed rgba(255,255,255,.45); color: rgba(255,255,255,.78);

}
.home-empty { text-align: center; color: rgba(255,255,255,.8); font-size: 13px; padding: 40px 0; }
/* 渐隐由 JS 驱动（applyHomeFade）：出场=板块顶缘升到视口 ~24% 线开始渐隐、~12% 线完全消失；
   入场=底部固定渐隐带（顶部效果的镜像，v6.15）：前板块下方便开始渐隐、尾板块初始全隐，上滑渐显 */
/* 回到主页悬浮钮 */
#homeFab {

  color: #3a4658; border-radius: 999px; padding: 8px 16px; cursor: pointer;
  font-size: 13px; font-weight: 700;

  display: none;
  font-family: inherit;
}
#homeFab:hover { background: rgba(255,255,255,.16); }

/* ========== 路线界面 · 内联编辑器（侧栏） ========== */
.info-panel .route-head {
  display: flex; align-items: center; gap: 6px;
  margin: 0 0 10px 0;
  padding: 0 2px;
}
.info-panel .route-head .nm {

}
.info-panel .route-head .menu {

}
.info-panel .route-head .menu:hover { background: rgba(0,0,0,0.12); }
.info-panel.sat-active .route-head .nm { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.55); }
.info-panel.sat-active .route-head .menu { color: #fff; background: rgba(255,255,255,0.18); }
.info-panel.sat-active .route-head .menu:hover { background: rgba(255,255,255,0.32); }
/* v6.18 OSRM 未取到路径提示条（液态玻璃体系内：暖色微底 + 细边） */
.info-panel .osrm-note {
  font-size: 11px; line-height: 1.55; letter-spacing: .2px;
  color: #8a5a17; background: rgba(255,203,120,.30);

}
.info-panel.sat-active .osrm-note { color: #ffd9a1; background: rgba(120,70,10,.34); border-color: rgba(255,200,120,.34); }
.info-panel .osrm-note .osrm-retry {
  margin-left: 6px; padding: 1px 9px; border-radius: 999px; cursor: pointer;
  font: inherit; font-size: 11px; font-weight: 600;

}
.info-panel .osrm-note .osrm-retry:hover { background: rgba(255,255,255,.88); }
.info-panel.sat-active .osrm-note .osrm-retry { color: #ffe4bb; background: rgba(255,255,255,.14); border-color: rgba(255,200,120,.40); }
.info-panel.sat-active .osrm-note .osrm-retry:hover { background: rgba(255,255,255,.26); }

/* 搜索 + 天数 stepper：紧凑一行 */
.info-panel .route-edit-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
/* 液态玻璃搜索框（v6.4：放大镜移出到右侧按钮，输入框仅放 placeholder 提示文字） */
.info-panel .ed-search-wrap { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
.info-panel .route-edit-row .ed-search {
  flex: 1; min-width: 0; width: 100%; padding: 7px 11px; font-size: 12.5px;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.72);
  border-radius: 11px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 2px 6px rgba(0,0,0,0.06);
  color: rgba(0,0,0,0.78);
  transition: border-color .15s, box-shadow .15s;
}
.info-panel .route-edit-row .ed-search::placeholder { color: rgba(80,85,95,0.42); font-weight: 500; }
.info-panel .route-edit-row .ed-search:focus { outline: none; border-color: rgba(80,85,95,0.55); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 2px 10px rgba(80,85,95,0.18); }
.info-panel.sat-active .route-edit-row .ed-search { background: rgba(20,30,50,0.32); border-color: rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 2px 6px rgba(0,0,0,0.25); color: rgba(255,255,255,0.92); }
.info-panel.sat-active .route-edit-row .ed-search::placeholder { color: rgba(255,255,255,0.50); }
/* 液态玻璃「放大镜」搜索按钮（取代原 搜索 文字按钮，保持 v6 玻璃风格） */
.info-panel .ed-search-go {
  flex: none; width: 34px; height: 34px; border-radius: 11px; cursor: pointer; border: 0;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.72);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 2px 6px rgba(0,0,0,0.06);
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(80,85,95,0.78); padding: 0;
  transition: background .15s, color .15s, transform .1s;
}
.info-panel .ed-search-go:hover { background: rgba(80,85,95,0.88); color: #fff; }
.info-panel .ed-search-go:active { transform: scale(0.95); }
.info-panel .ed-search-go svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.info-panel.sat-active .ed-search-go { background: rgba(20,30,50,0.32); border-color: rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 2px 6px rgba(0,0,0,0.25); color: rgba(255,255,255,0.88); }
.info-panel.sat-active .ed-search-go:hover { background: rgba(255,255,255,0.85); color: rgba(80,85,95,0.95); }

/* 编辑中标记（路线名右侧的「编辑中」小药丸） */
.info-panel .route-head .edit-pill {
  flex: none; font-size: 10.5px; font-weight: 700; color: #fff;
  background: rgba(80,85,95,0.88); padding: 2px 8px; border-radius: 999px; letter-spacing: 0.4px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
}
.info-panel.sat-active .route-head .edit-pill { background: rgba(255,255,255,0.85); color: rgba(40,45,55,0.95); }

/* ===== v6.4 视图/编辑模式切换 ===== */
/* 默认（视图模式）：隐藏搜索行、保存行、内联编辑按钮、关闭拖拽 */
.info-panel:not(.editing) .route-edit-row,
.info-panel:not(.editing) .save-row { display: none; }
.info-panel:not(.editing) .wp-item .ops { display: none !important; }
.info-panel:not(.editing) .wp-item[draggable] { cursor: pointer; }
/* 视图模式下空列表的提示更柔和 */
.info-panel:not(.editing) .wp-list { padding-top: 2px; }

/* ===== 地图旁「添加到第 N 天」液态玻璃卡片（v6：搜索/点图后预览点右侧弹出） ===== */
.map-daypop .leaflet-popup-content-wrapper { background: transparent; box-shadow: none; border-radius: 16px; padding: 0; }
.map-daypop .leaflet-popup-content { margin: 0; width: auto !important; }
.map-daypop .leaflet-popup-tip {
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.6);
  box-shadow: 0 1px 6px rgba(0,0,0,0.10);
}
/* v6.10.3 地点详情 popup 玻璃化（白.10 + blur(20px) + 受光） */
.leaflet-popup-content-wrapper {
  background: rgba(255,255,255,0.10);
  backdrop-filter: blur(8px) saturate(140%);
  -webkit-backdrop-filter: blur(8px) saturate(140%);
  border: 1px solid rgba(255,255,255,0.50);
  border-radius: 14px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), inset 0 12px 18px -12px rgba(255,255,255,0.30), 0 10px 26px rgba(0,0,0,0.10);
}
.leaflet-popup-content { margin: 12px 16px; color: rgba(35,45,66,0.92); font-size: 12.5px; line-height: 1.6; }
.leaflet-popup-tip { background: rgba(255,255,255,0.10); }
/* v6.10.3 底图选择控件玻璃化（白.10 + blur(20px) + 受光） */
.leaflet-control-layers {
  background: rgba(255,255,255,.10);
  backdrop-filter: var(--glass-blur-panel); -webkit-backdrop-filter: var(--glass-blur-panel);
  border: 1px solid var(--glass-border) !important;
  border-radius: 12px;
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo), var(--glass-shadow) !important;
  color: #3a4658;
  padding: 8px 10px;
}
.leaflet-control-layers-expanded { padding: 8px 10px; color: #3a4658; }
.leaflet-control-layers:hover { background: rgba(255,255,255,.20); }
/* v6.10.2 缩放控件玻璃化 */
.leaflet-control-zoom { border: none !important; box-shadow: none !important; border-radius: 12px; overflow: hidden; }
.leaflet-control-zoom a {
  background: rgba(255,255,255,.10);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: none; color: #3a4658 !important;
  border-bottom: 1px solid rgba(255,255,255,.25);
  transition: background .15s;
}
.leaflet-control-zoom a:last-child { border-bottom: none; }
.leaflet-control-zoom a:hover { background: rgba(255,255,255,.20); color: #222 !important; }
/* 深色底图变体：卫星/NatGeo 上改暗玻璃白字 */
.map-dark .leaflet-popup-content-wrapper,
.map-dark .leaflet-control-layers,
.map-dark .leaflet-control-zoom a {
  background: rgba(255,255,255,.10); color: rgba(255,255,255,.92); border-color: rgba(255,255,255,.25);
}
.map-dark .leaflet-popup-tip { background: rgba(255,255,255,.10); }
.map-dark .leaflet-popup-content { color: rgba(255,255,255,.92); }
body.map-dark .set-label { color: rgba(255,255,255,.94); }
body.map-dark .set-label .hint { color: rgba(255,255,255,.65); }
.map-dark .leaflet-control-layers label, .map-dark .leaflet-control-layers .leaflet-control-layers-selector { color: rgba(255,255,255,.92); }
.map-dark .leaflet-control-zoom a:hover, .map-dark .leaflet-control-layers:hover { background: rgba(255,255,255,.20); color: #fff !important; }
.day-card {

.info-panel .search-res { margin-bottom: 8px; max-height: 132px; }
.info-panel .search-res .res-item { padding: 5px 8px; font-size: 12px; cursor: pointer; }
.info-panel .search-res .res-item:hover { background: rgba(80,85,95,0.10); }
.info-panel .search-res .res-add { padding: 4px 8px; font-size: 11px; }
.info-panel.sat-active .search-res { background: rgba(20,30,50,0.88); color: #fff; border-color: rgba(255,255,255,0.18); }
.info-panel.sat-active .search-res .res-item { color: #fff; border-bottom-color: rgba(255,255,255,0.1); }
.info-panel.sat-active .search-res .res-item:hover { background: rgba(255,255,255,0.15); }
.info-panel.sat-active .search-res .res-item .a { color: rgba(255,255,255,0.65); }
.info-panel.sat-active .search-res .res-add { background: rgba(255,255,255,0.85); color: #555; border-color: rgba(255,255,255,0.5); }

/* 各天及地点（侧栏 wpList 同时承担阅读 + 编辑） */
.wp-list { gap: 0; }
.wp-list .day-label { margin-top: 7px; }
.wp-item { padding: 4px 6px; border-radius: 8px; }
.wp-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wp-item .ops {
  display: flex; gap: 1px; flex: none;
  opacity: 0; transition: opacity .12s;
  margin-left: 4px;
}
.wp-item:hover .ops, .wp-item.flying .ops { opacity: 0.92; }
.wp-item .ops button {
  border: none; background: transparent; cursor: pointer; color: #888;
  font-size: 12px; padding: 1px 3px; line-height: 1; border-radius: 5px;

}
.wp-item .ops button:hover { background: rgba(0,0,0,0.1); color: #222; }
.wp-item .ops button.del:hover { color: #c0392b; background: rgba(192,57,43,0.12); }

.wp-item.editing { background: rgba(80,85,95,0.10); }
.wp-item.editing .ops { display: none; }
.wp-item .nm-input {
  flex: 1; min-width: 0; border: 1px solid #555; border-radius: 6px;
  padding: 1px 5px; font-size: 12px; outline: none; background: #fff; color: #222; box-sizing: border-box;
}

.wp-item.drop-below { box-shadow: 0 2px 0 0 #555 inset; }

.info-panel.sat-active .wp-item .ops button { color: rgba(255,255,255,0.85); }
.info-panel.sat-active .wp-item .ops button:hover { background: rgba(255,255,255,0.2); color: #fff; }
.info-panel.sat-active .wp-item.editing { background: rgba(255,255,255,0.15); }
.info-panel.sat-active .wp-item .nm-input { background: rgba(255,255,255,0.95); color: #222; }

/* 保存行 */
.save-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08);
}
/* v6.4 保存按钮：液态玻璃 + 仅「保存」二字 */
.save-row .save-btn {
  flex: 1; padding: 9px 12px; font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
  background: rgba(255,255,255,.10);
  backdrop-filter: var(--glass-blur-panel); -webkit-backdrop-filter: var(--glass-blur-panel);
  border: 1px solid var(--glass-border);
  border-radius: 11px;
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo), var(--glass-shadow);
  color: rgba(40,48,66,.95);
  transition: background .15s, color .15s, transform .1s;
  font-family: inherit;
}
.save-row .save-btn:hover { background: rgba(255,255,255,.30); color: rgba(40,48,66,1); }
.save-row .save-btn:active { transform: scale(0.98); }
.save-row .dirty-hint {
  flex: none; font-size: 11px; color: #c0392b; font-weight: 600;
  opacity: 0; transition: opacity .2s;
}
.save-row.dirty .dirty-hint { opacity: 1; }
.save-row.dirty .save-btn {
  background: rgba(80,85,95,0.92); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.20), 0 0 0 2px rgba(192,57,43,0.32);
  animation: pulseDirty 1.5s ease-in-out infinite;
}
@keyframes pulseDirty {
  0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.20), 0 0 0 2px rgba(192,57,43,0.3); }
  50%      { box-shadow: inset 0 1px 0 rgba(255,255,255,0.20), 0 0 0 4px rgba(192,57,43,0.55); }
}
.save-row .save-btn:disabled { opacity: 0.5; cursor: not-allowed; animation: none; }
.info-panel.sat-active .save-row { border-top-color: rgba(255,255,255,0.18); }
.info-panel.sat-active .save-row .dirty-hint { color: #ff8e7a; }
.info-panel.sat-active .save-row .save-btn { background: rgba(20,30,50,0.32); border-color: rgba(255,255,255,0.22); color: rgba(255,255,255,0.95); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 2px 8px rgba(0,0,0,0.25); }
.info-panel.sat-active .save-row .save-btn:hover { background: rgba(255,255,255,0.85); color: rgba(40,45,55,0.95); }
.info-panel.sat-active .save-row.dirty .save-btn { background: rgba(255,255,255,0.92); color: rgba(40,45,55,0.95); }

/* 路线菜单弹层 */
.route-menu-pop {
  position: fixed; top: 56px; left: 18px; z-index: 1600;
  background: rgba(255,255,255,.10); border-radius: 14px;
  backdrop-filter: var(--glass-blur-panel); -webkit-backdrop-filter: var(--glass-blur-panel);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-shadow), 0 12px 32px rgba(0,0,0,.10);
  display: none; flex-direction: column; min-width: 168px;
  border: 1px solid var(--glass-border); overflow: hidden;
  font-family: inherit;
}
.route-menu-pop.open { display: flex; }

var pendingDel = null;

  if (pendingDel === id) {
    pendingDel = null;
    doDeleteRoute(id).catch(function (e) { toast("删除失败：" + (e && e.message ? e.message : "未知错误")); });
  } else {
    pendingDel = id;
    var nm = catGet(id) ? catGet(id).name : id;
    toast("再次点击 ✕ 确认删除「" + nm + "」（将从 GitHub 仓库移除该路线文件）");
    setTimeout(function () { if (pendingDel === id) pendingDel = null; }, 2600);
  }
}
function doDeleteRoute(id) {
  if (!ghEnabled()) return Promise.reject(new Error("未配置 GitHub 仓库，无法删除（路线真源在仓库）"));
  if (!ghNeedToken()) return Promise.reject(new Error("删除路线需要 GitHub Token"));
  var nm = catGet(id) ? catGet(id).name : id;
  return ghDelete(routeFileOf(id), "route: delete " + nm).then(function () {
    delete ROUTE_PACKS[id];
    catRemove(id);
    if (activeRouteId === id) {
      // v6：删除的是当前正在编辑的路线 → 清空编辑态回主页（画廊展示剩余路线）
      activeRouteId = null;
      edCtx.work = null;
      edCtx.dirty = false;
      edCtx.preset = { c: null, tag: "" };
      document.querySelector(".save-row").classList.remove("dirty");

      renderWpList();
      syncHash("#/"); // v6.5.2：删除当前路线后回到主页（浏览器历史同步）
    }
    return pushCatalog("route: delete " + nm).then(function () {
      rebuildMeta(); rebuildRouteList(); persistCache();
      toast("路线「" + nm + "」已删除（仓库已同步）");
    });
  });
}

$("wpList").addEventListener("click", function (ev) {
  var opBtn = ev.target.closest("button[data-op]");
  if (!opBtn) return; // 非操作按钮 → 交给 wpList 主点击事件处理（飞往标记）
  ev.stopPropagation(); // 阻止冒泡触发飞往
  if (!edCtx.work) return;
  var row = opBtn.closest(".wp-item");
  if (!row) return;
  var i = parseInt(row.getAttribute("data-i"), 10);
  var stops = edCtx.work.stops;
  var op = opBtn.getAttribute("data-op");
  if (op === "rename") {
    startRename(i); // 行内改名：Enter/失焦提交，Esc 取消
    return;
  }
  if (op === "del") {
    stops.splice(i, 1);
  } else if (op === "up" || op === "down") {
    var d = stops[i].day;
    // 在同天内找相邻项
    var target = -1;
    if (op === "up") { for (var u = i - 1; u >= 0; u--) if (stops[u].day === d) { target = u; break; } }
    else { for (var v = i + 1; v < stops.length; v++) if (stops[v].day === d) { target = v; break; } }
    if (target >= 0) { var tmp = stops[i]; stops[i] = stops[target]; stops[target] = tmp; }
  } else if (op === "prevDay") {
    stops[i].day = Math.max(1, stops[i].day - 1);
  } else if (op === "nextDay") {
    stops[i].day += 1;
  }
  normalizeRoute(edCtx.work);
  applyEditToMap();
  markDirty();
});

/* ---------- 地点整行拖拽重排（换位 / 换天） ---------- */
var dragSrc = null, dragOverRow = null, dragOverDay = null;
function clearDropMarks() {
  var box = $("wpList");
  var marks = box.querySelectorAll(".dragging-src, .drop-above, .drop-below, .drop-target");
  for (var i = 0; i < marks.length; i++) marks[i].classList.remove("dragging-src", "drop-above", "drop-below", "drop-target");
}
function moveStop(srcIdx, dstIdx, pos) {
  var stops = edCtx.work.stops;
  if (srcIdx === dstIdx) return;
  var obj = stops[srcIdx];
  var dstDay = stops[dstIdx].day;
  stops.splice(srcIdx, 1);
  var t2 = dstIdx > srcIdx ? dstIdx - 1 : dstIdx;
  obj.day = dstDay;
  stops.splice(Math.min(pos === 0 ? t2 : t2 + 1, stops.length), 0, obj);
  normalizeRoute(edCtx.work);
  applyEditToMap();
  markDirty();
}
function moveStopToDay(srcIdx, day) {
  var stops = edCtx.work.stops;
  var obj = stops[srcIdx];
  stops.splice(srcIdx, 1);
  obj.day = Math.max(1, day | 0);
  var e = -1, i;
  for (i = 0; i < stops.length; i++) if (stops[i].day === obj.day) e = i;
  var ins = stops.length;
  if (e >= 0) ins = e + 1;
  else { for (i = 0; i < stops.length; i++) if (stops[i].day > obj.day) { ins = i; break; } }
  stops.splice(ins, 0, obj);
  normalizeRoute(edCtx.work);
  applyEditToMap();
  markDirty();
}
var edStopsBox = $("wpList"); // v6：拖拽/事件目标绑定到侧栏 wpList
edStopsBox.addEventListener("dragstart", function (ev) {

  if (!row || row.classList.contains("editing")) { ev.preventDefault(); return; }
  dragSrc = parseInt(row.getAttribute("data-i"), 10);
  if (isNaN(dragSrc)) { dragSrc = null; return; }
  try { ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", String(dragSrc)); } catch (e) {}
  setTimeout(function () { row.classList.add("dragging-src"); }, 0);
});
edStopsBox.addEventListener("dragover", function (ev) {
  if (dragSrc == null) return;
  ev.preventDefault();
  try { ev.dataTransfer.dropEffect = "move"; } catch (e) {}
  clearDropMarks();
  var day = ev.target.closest ? ev.target.closest(".day-label") : null;
  if (day) {
    dragOverRow = null;
    dragOverDay = parseInt(day.getAttribute("data-day"), 10);
    day.classList.add("drop-target");
    return;
  }
  var row = ev.target.closest ? ev.target.closest(".wp-item") : null;
  if (row) {
    dragOverDay = null;
    dragOverRow = { i: parseInt(row.getAttribute("data-i"), 10), pos: 0 };
    var rect = row.getBoundingClientRect();
    if (rect.height > 0 && ev.clientY > rect.top + rect.height / 2) dragOverRow.pos = 1;
    row.classList.add(dragOverRow.pos === 0 ? "drop-above" : "drop-below");

});
edStopsBox.addEventListener("drop", function (ev) {

  dragSrc = null; dragOverRow = null; dragOverDay = null;
  clearDropMarks();
  if (dayT != null) moveStopToDay(src, dayT);
  else if (rowT && rowT.i !== src) moveStop(src, rowT.i, rowT.pos);
  applyEditToMap();
  markDirty();
});
edStopsBox.addEventListener("dragend", function () {
  dragSrc = null; dragOverRow = null; dragOverDay = null;
  clearDropMarks();
});
edStopsBox.addEventListener("dragleave", function (ev) {

function addStop(name, lat, lng, dayOpt) {

  normalizeRoute(edCtx.work);

  // 而是始终由 renderWpList 重绘内联编辑器（✎改名 / ↑↓ / ◀▶换天 / ✕删除 / 拖拽换天都依赖它）。
  var obj = renderGeneric(edCtx.work);
  applyRoute(obj, true);
  segWarnRender(obj.segWarns); // v6.20.5 数据层异常不静默（缺 path / 非法 p）；放在 applyRoute 之后，避免被内部状态重置覆盖
  renderWpList();
}
// v6.5.3 打开路线自动取景：路线整体居中 + 四周留白。
// 只在「打开」场景调用一次（进入已有路线 / 复制副本）；编辑过程（加站 / 拖拽 / 换天）不打断用户视角。
// 左侧半透明玻璃面板（约 220px 宽）占据视觉重心：把视图中心相对路线中心向西偏移约 7.5% 视口宽，
// 使路线在「扣除面板的可见区」内视觉居中，避免路线左缘被面板遮挡显得拥挤。
function fitRouteView() {
  var w = edCtx.work;
  if (!w || !w.stops || !w.stops.length) return;
  var b = L.latLngBounds([]);
  w.stops.forEach(function (s) { b.extend([s.lat, s.lng]); });
  var segs = w.segs || {};
  for (var k in segs) if (segs.hasOwnProperty(k) && segs[k] && segs[k].poly) {
    var pl = segs[k].poly;
    for (var i = 0; i < pl.length; i++) b.extend([pl[i][0], pl[i][1]]);
  }
  if (!b.isValid()) return;
  var vp = map.getSize();
  var pad = L.point(Math.round(vp.x * 0.12), Math.round(vp.y * 0.15));
  // 先 fitBounds（animate:false 立即就位；Leaflet 内部正确计算 zoom + snap 0.5 + padding），
  // 再 setView 把视图中心向西偏移 shift 像素（左面板 ~220px 视觉补偿）
  map.fitBounds(b, { padding: pad, animate: false });
  var z = map.getZoom();
  var shift = Math.round(vp.x * 0.075);
  if (shift > 0) {
    var c = map.getCenter();
    var px = map.project(c, z);
    map.setView(map.unproject(L.point(px.x - shift, px.y), z), z, { animate: false }); // v6.12.1 取景补偿改为瞬时（避免转场后再横向平移一下）
  }
}

/* ============================================================
 * v6 「添加到第 N 天」液态玻璃卡片：
 * 搜索结果 / GPS / 点击地图 → 地图上出现预览点（＋青色），点右侧弹出玻璃卡片选天，点某天即加入
 * ============================================================ */
var pvSeq = 0;           // 预览 marker 唯一 id
var pvMarker = null;     // 当前预览 marker（Leaflet）
var pvLatLng = null;     // 预览点坐标 {lat,lng}
var pvName = "";         // 预览点名称
function clearPreview() {
  if (pvMarker) { try { map.removeLayer(pvMarker); } catch (e) {} pvMarker = null; }
  pvLatLng = null; pvName = "";
}
function maxRouteDay() {
  var mx = 1;
  (edCtx.work && edCtx.work.stops ? edCtx.work.stops : []).forEach(function (s) { if ((s.day || 1) > mx) mx = s.day; });
  return mx;
}
// 打开预览点 + 右侧玻璃卡片；p = {name, lat, lng}
function openDayCard(p) {
  if (!edCtx.work) { toast("请先新建或进入一条路线"); return; }
  if (!(p && isFinite(p.lat) && isFinite(p.lng))) return;
  clearPreview();
  pvSeq++;
  var lat = p.lat, lng = p.lng;
  pvName = (p.name && String(p.name).trim()) ? String(p.name).trim() : (lat.toFixed(4) + ", " + lng.toFixed(4));
  var uid = "pv" + pvSeq;
  // 预览点：半透明青色「＋」，自定义 popupAnchor 让玻璃卡片落在点右侧
  var preIcon = L.divIcon({
    className: "wp-marker wp-marker-pre",
    html: pinSvg("＋", "#0EA5A0", 15, uid),
    iconSize: [28, 40],
    iconAnchor: [14, 38],
    popupAnchor: [28, -20]   // tip → 预览点右侧中段，玻璃卡片自然落在点的右边
  });
  pvMarker = L.marker([lat, lng], { icon: preIcon, zIndexOffset: 800, keyboard: false }).addTo(map);
  pvLatLng = { lat: lat, lng: lng };
  map.flyTo([lat, lng], Math.max(map.getZoom(), 10), { duration: 0.55 });
  // 可加入的天：1..当前最高天+1（与 stepper 当前值取并集；防止 chips 过多，最多到 12+1）
  var mx = Math.max(maxRouteDay(), curDay) + 1;
  if (mx > 13) mx = 13;
  var chips = "";
  for (var d = 1; d <= mx; d++) {
    chips += '<button type="button" class="dc-day' + (d === curDay ? " cur" : "") + '" data-day="' + d + '">第 ' + d + " 天</button>";
  }
  var html = '<div class="daypop-inner"><div class="day-card">' +
    '<div class="dc-title">' + esc(pvName) + '</div>' +
    '<div class="dc-sub">添加到第几天？</div>' +
    '<div class="dc-chips">' + chips + '</div>' +
    '<div class="dc-foot"><button type="button" class="dc-cancel">取消</button>' +
    '<span class="dc-tip">点地图可换位置</span></div>' +
    "</div></div>";
  L.popup({ className: "map-daypop", closeButton: false, autoClose: false, offset: L.point(16, -10), maxWidth: 280 })
    .setLatLng([lat, lng])
    .setContent(html)
    .openOn(map);
  var inner = document.querySelector(".daypop-inner");
  if (inner) bindDayCard(inner);
  hideRes();
  $("edSearch").value = "";
  // 点地图任意处可移动预览点（换位置），点已有路线点/控件不触发
}
function commitDay(day) {
  if (!pvLatLng) return;
  var lat = pvLatLng.lat, lng = pvLatLng.lng, name = pvName;
  clearPreview();
  try { map.closePopup(); } catch (e) {}
  addStop(name, lat, lng, day);
  toast("已把「" + name + "」加入第 " + day + " 天");
}
function bindDayCard(box) {
  var chips = box.querySelectorAll(".dc-day");
  for (var i = 0; i < chips.length; i++) {
    chips[i].addEventListener("click", function (ev) {
      ev.stopPropagation();
      commitDay(parseInt(this.getAttribute("data-day"), 10));
    });
  }
  var cancel = box.querySelector(".dc-cancel");
  if (cancel) cancel.addEventListener("click", function (ev) { ev.stopPropagation(); clearPreview(); try { map.closePopup(); } catch (e) {} });
}
// 地图点击：预览点可移动；点已有 marker / popup / 控件不响应
// v6.4：仅在编辑模式下点空白处才弹「添加到第几天」卡片（视图模式只读，不加站）
map.on("click", function (ev) {
  if (!edCtx.work || !edCtx.editMode) return;
  var t = ev.originalEvent && ev.originalEvent.target;
  if (t && t.closest && (t.closest(".leaflet-interactive") || t.closest(".leaflet-popup") || t.closest(".leaflet-control") || t.closest(".wp-marker"))) return;
  openDayCard({ name: "", lat: ev.latlng.lat, lng: ev.latlng.lng });
});

/* ---------- dirty 跟踪 + 保存按钮 ---------- */

/* ---------- 搜索：坐标 / 本地点位 / 高德 ---------- */
function toLL(x, y) {
  if (!(isFinite(x) && isFinite(y))) return null;
  // 纬度范围 [-90, 90]：据此自动识别“纬度,经度”与“经度,纬度”两种输入顺序
  if (Math.abs(x) <= 90 && Math.abs(y) > 90) return { lat: x, lng: y }; // 纬度,经度
  if (Math.abs(x) > 90 && Math.abs(y) <= 90) return { lat: y, lng: x }; // 经度,纬度
  return { lat: x, lng: y }; // 两值都在 ±90 内时按中文习惯默认“纬度,经度”
}
function parseCoord(t) {
  var parts = t.split(/[,，;；\s]+/).filter(function (x) { return x.length; });
  var nums = parts.map(Number);
  if (parts.length === 2) {
    var ll2 = toLL(nums[0], nums[1]);
    if (ll2) return { name: "", lat: ll2.lat, lng: ll2.lng };
  }
  if (parts.length >= 3) {
    var ll = toLL(nums[parts.length - 2], nums[parts.length - 1]);
    if (ll) return { name: parts.slice(0, parts.length - 2).join(" "), lat: ll.lat, lng: ll.lng };
  }
  return null;
}
function showRes(html) {
  var box = $("edResults");
  box.innerHTML = html;
  box.classList.add("show");
}
function hideRes() { $("edResults").classList.remove("show"); }
// 搜索结果行：点击整行 → 地图预览点 + 「添加到第 N 天」玻璃卡片（不再放行内加站按钮）
function resAddHtml(p) {
  return '<div class="res-item" data-lat="' + p.lat + '" data-lng="' + p.lng + '" data-name="' + esc(p.name) + '" title="在地图上预览并添加">' +
    '<div class="rn"><div>' + esc(p.name) + '</div><div class="a">' + esc(p.addr || "") + "</div></div>" +
    '<span class="latlng">' + p.lat.toFixed(4) + ", " + p.lng.toFixed(4) + "</span>" +
    '<span class="res-add">＋ 预览</span></div>';
}
$("edResults").addEventListener("click", function (ev) {
  var item = ev.target.closest ? ev.target.closest(".res-item") : null;
  if (!item) return;
  openDayCard({
    name: item.getAttribute("data-name"),
    lat: parseFloat(item.getAttribute("data-lat")),
    lng: parseFloat(item.getAttribute("data-lng"))
  });
});
var searchSeq = 0, localShown = false;
function amapSearch(q, isText, seq) {
  var base = isText
    ? "https://restapi.amap.com/v3/place/text?keywords=" + encodeURIComponent(q) + "&offset=8&page=1&extensions=base&output=json"
    : "https://restapi.amap.com/v3/geocode/geo?address=" + encodeURIComponent(q) + "&output=json";
  fetch(base + "&key=" + encodeURIComponent(store.amapKey))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (seq !== searchSeq) return; // 已有更新的搜索，丢弃过期结果
      var items = [];
      if (isText) {
        if (j && j.status === "1" && j.pois) {
          j.pois.forEach(function (p) {
            var ll = String(p.location || "").split(",");
            if (ll.length === 2) {
              var w = gcj02towgs84(parseFloat(ll[0]), parseFloat(ll[1]));
              items.push({ name: p.name, addr: [p.pname, p.cityname, p.adname, p.address].filter(Boolean).join(" "), lat: w[1], lng: w[0] });
            }
          });
        }
      } else if (j && j.status === "1" && j.geocodes) {
        j.geocodes.forEach(function (g) {
          var ll = String(g.location || "").split(",");
          if (ll.length === 2) {
            var w2 = gcj02towgs84(parseFloat(ll[0]), parseFloat(ll[1]));
            items.push({ name: g.formatted_address || q, addr: g.formatted_address || "", lat: w2[1], lng: w2[0] });
          }
        });
      }
      if (items.length) {
        localShown = false;
        showRes(items.map(resAddHtml).join(""));
      } else if (isText) {
        amapSearch(q, false, seq); // 关键词搜索无果 → 退化地址解析
      } else if (localShown) {
        toast("高德未找到更多结果，保留内置匹配");
      } else {
        showRes('<div class="res-empty">未找到「' + esc(q) + "」相关地点</div>");
      }
    })
    .catch(function () {
      if (seq !== searchSeq) return;
      if (isText) amapSearch(q, false, seq);
      else if (localShown) toast("高德搜索失败，保留内置匹配");
      else showRes('<div class="res-empty">搜索失败（网络或 Key 问题）</div>');
    });
}
function doSearch() {
  var q = $("edSearch").value.trim();
  if (!q) return;
  var c = parseCoord(q);
  if (c) {
    // GPS：不直接入库，先在地图上预览并弹出「添加到第 N 天」卡片
    openDayCard({ name: c.name, lat: c.lat, lng: c.lng });
    return;
  }
  var seq = ++searchSeq;
  localShown = false;
  // 本地点位命中（内置路线中出现过的地名，离线也能用）
  var loc = BUILTIN_PLACES.filter(function (p) { return p.name.indexOf(q) >= 0; });
  if (loc.length) {
    localShown = true;
    showRes(loc.slice(0, 6).map(function (p) { return resAddHtml({ name: p.name, addr: "内置已知地点", lat: p.lat, lng: p.lng }); }).join(""));
  }
  if (!store.amapKey) {
    if (!loc.length) {
      showRes('<div class="res-empty">本地无匹配。配置高德 Key 后可搜索全国地名。<br><button class="ed-btn" style="margin-top:8px;padding:6px 12px;" id="needKeyBtn">打开设置</button></div>');
      var nb = $("needKeyBtn");
      if (nb) nb.addEventListener("click", openSettings);
    }
    return;
  }
  amapSearch(q, true, seq);
}
$("edSearchBtn").addEventListener("click", doSearch);
$("edSearch").addEventListener("keydown", function (ev) { if (ev.key === "Enter") doSearch(); });

/* ---------- GitHub 真源（v5）：每条路线 = routes/<id>.js + catalog.js 目录索引 ---------- */
var ghBusy = 0, ghDirtyTimer = null;
function ghConf() {
  var g = store.gh || {};
  return { repo: ((g.repo || "").trim() || GH_DEFAULT_REPO), branch: ((g.branch || "").trim() || GH_DEFAULT_BRANCH), token: (g.token || "").trim() };
}
function ghEnabled() { var g = ghConf(); return !!(g.repo && g.branch && g.repo.indexOf("/") > 0); }
function ghNeedToken() { var g = ghConf(); return !!g.token; }
function ghParts() { var g = ghConf(); var p = g.repo.split("/"); return { owner: p[0].trim(), repo: p[1].trim() }; }
function ghApi(url, method, body) {
  var g = ghConf();
  var headers = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  if (g.token) headers["Authorization"] = "Bearer " + g.token;
  if (body) headers["Content-Type"] = "application/json";
  var opt = { method: method, headers: headers, cache: "no-store" };
  if (body) opt.body = JSON.stringify(body);
  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  if (ctrl) { opt.signal = ctrl.signal; setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 20000); }
  return fetch(url, opt).then(function (r) {
    return r.json().then(function (j) { return { status: r.status, json: j }; });
  });
}
function ghUrl(p) { var o = ghParts(); return "https://api.github.com/repos/" + o.owner + "/" + o.repo + "/contents/" + p; }
function b64Text(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = "";
  for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function decodeContent(content) {
  var bin = atob(content.replace(/\s/g, ""));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes); // UTF-8，中文不乱码
}
// 读取仓库文件：存在返回 {sha,text}，不存在返回 null
function ghRead(p) {
  return ghApi(ghUrl(p) + "?ref=" + encodeURIComponent(ghConf().branch), "GET").then(function (res) {
    if (res.status === 200 && res.json && res.json.content) return { sha: res.json.sha, text: decodeContent(res.json.content) };
    if (res.status === 404) return null;
    throw new Error("读取失败 HTTP " + res.status + (res.json && res.json.message ? " " + res.json.message : ""));
  });
}
// 写文件（存在则带 sha 覆盖）
function ghWrite(p, content, msg) {
  var payload = { message: msg || "route update", branch: ghConf().branch, content: b64Text(content) };
  return ghRead(p).then(function (doc) {
    if (doc && doc.sha) payload.sha = doc.sha;
    return ghApi(ghUrl(p), "PUT", payload).then(function (r2) {
      if (r2.status === 200 || r2.status === 201) return r2.json;
      throw new Error("写入失败 HTTP " + r2.status + (r2.json && r2.json.message ? " " + r2.json.message : "") + "（Token 需 repo 权限）");
    });
  });
}
// 删文件
function ghDelete(p, msg) {
  return ghRead(p).then(function (doc) {
    if (!doc) return null;
    return ghApi(ghUrl(p), "DELETE", { message: msg || "route delete", branch: ghConf().branch, sha: doc.sha }).then(function (r2) {
      if (r2.status === 200 || r2.status === 204) return true;
      throw new Error("删除失败 HTTP " + r2.status + (r2.json && r2.json.message ? " " + r2.json.message : ""));
    });
  });
}

/* ---------- 序列化（与 routes/*.js 文件同格式） ---------- */
function routeObjForFile(r) {
  return {
    id: r.id, name: String(r.name || "未命名路线"),
    stops: (r.stops || []).map(function (s) { return { name: s.name, lat: Number(s.lat), lng: Number(s.lng), day: Math.max(1, parseInt(s.day, 10) || 1), tag: s.tag || "" }; }),
    segs: r.segs || {},
    preset: presetValid(r.preset) ? { c: r.preset.c, tag: String(r.preset.tag || "").slice(0, 8) } : undefined
  };
}
function routeFileText(r) {
  return '(function(){window.ROUTE_PACKS=window.ROUTE_PACKS||{};window.ROUTE_PACKS["' + r.id + '"]=' + JSON.stringify(routeObjForFile(r)) + ';})();\n';
}
function catalogFileText() {
  var cats = (ROUTE_CATALOG || []).map(function (c) {
    return { id: c.id, name: c.name, file: c.file || "routes/" + c.id + ".js", days: c.days || 1, n: c.n || 0, color: c.color || "" };
  });
  return 'window.ROUTE_CATALOG=' + JSON.stringify(cats) + ';\nwindow.ROUTE_PLACES=' + JSON.stringify(window.ROUTE_PLACES || []) + ';\n';
}
// 保存路线 = 更新运行时 + 推路线文件 + 推目录
function saveRouteToRepo(r) {
  if (!ghEnabled()) return Promise.reject(new Error("未配置 GitHub 仓库（⚙ 设置）"));
  if (!ghNeedToken()) return Promise.reject(new Error("保存路线到 GitHub 需要 Token"));
  var id = r.id;
  ROUTE_PACKS[id] = r;
  catUpsert({ id: id, name: r.name, file: routeFileOf(id), days: routeDays(r), n: (r.stops || []).length, color: routeColorOf(id, r) });
  return ghWrite("routes/" + id + ".js", routeFileText(r), "route: save " + r.name)
    .then(function () { return pushCatalog("route: catalog"); })
    .then(function () { rebuildMeta(); rebuildRouteList(); persistCache(); });
}
// OSRM 后台回填后防抖推回路线文件
function scheduleDirtyPush(id) {
  if (!ghEnabled() || !ghNeedToken()) return;
  if (ghDirtyTimer) clearTimeout(ghDirtyTimer);
  ghDirtyTimer = setTimeout(function () {
    var pk = ROUTE_PACKS[id];
    if (!pk) return;
    if (ghBusy >= 3) { scheduleDirtyPush(id); return; }
    ghBusy++;
    ghWrite("routes/" + id + ".js", routeFileText(pk), "route: osrm cache " + pk.name)
      .catch(function () {})
      .then(function () { ghBusy--; });
  }, 1500);
}
// 把当前目录推回仓库
function pushCatalog(msg) { return ghWrite("routes/catalog.js", catalogFileText(), msg || "route: catalog update"); }
// 启动时若已配置 Token：自动从仓库刷新目录（仓库是唯一真源）
function ghInit() {
  if (!ghEnabled() || !ghNeedToken()) return Promise.resolve();
  return refreshFromRepo().then(function (info) {
    if (info) toast("已从 GitHub 刷新目录：" + info.total + " 条路线" + (info.newFiles ? "（新拉取数据 " + info.newFiles + " 条）" : ""));
    return info;
  }).catch(function (e) { return { error: true, msg: e && e.message ? e.message : "" }; });
}
// 解析远端 catalog.js 文本（读入临时数组后还原本地数组，避免直接覆盖）
function parseCatalogText(text) {
  var keepCat = window.ROUTE_CATALOG, keepPlaces = window.ROUTE_PLACES;
  try { (new Function(text))(); } catch (e) {}
  var out = { cat: window.ROUTE_CATALOG || [], places: window.ROUTE_PLACES || [] };
  window.ROUTE_CATALOG = keepCat;
  window.ROUTE_PLACES = keepPlaces;
  return out;
}
// 从仓库刷新：目录以仓库为准；只预取“站点未发布”的新路线数据文件（站点已有文件走同源懒加载）
function refreshFromRepo() {
  if (!ghEnabled()) return Promise.reject(new Error("未配置 GitHub 仓库（⚙ 设置）"));
  var shipped = {};
  (ROUTE_CATALOG || []).forEach(function (c) { shipped[c.id] = c.file; });
  return ghRead("routes/catalog.js").then(function (doc) {
    if (!doc) throw new Error("仓库里还没有 routes/catalog.js（保存任意一条路线时会自动创建目录）");
    var remote = parseCatalogText(doc.text);
    ROUTE_CATALOG.length = 0;
    (remote.cat || []).forEach(function (c) {
      if (!c || !c.id) return;
      catUpsert({ id: c.id, name: c.name, file: c.file || "routes/" + c.id + ".js", days: c.days || 1, n: c.n || 0, color: c.color || "" });
    });
    (remote.places || []).forEach(function (p) {
      if (!p || !p.name) return;
      var dup = (window.ROUTE_PLACES || []).some(function (q) { return q.name === p.name && Math.abs(q.lat - p.lat) < 1e-6 && Math.abs(q.lng - p.lng) < 1e-6; });
      if (!dup) window.ROUTE_PLACES.push(p);
    });
    var fetchList = (remote.cat || []).filter(function (c) { return c && c.id && !ROUTE_PACKS[c.id] && !shipped[c.id]; });
    return fetchList.reduce(function (p, c) {
      return p.then(function () {
        return ghRead(c.file).then(function (fd) {
          if (fd) { try { (new Function(fd.text))(); } catch (e) {} }
        }).catch(function () {});
      });
    }, Promise.resolve()).then(function () {
      rebuildMeta(); rebuildRouteList(); persistCache();
      return { total: (remote.cat || []).length, newFiles: fetchList.length };
    });
  });
}
// 手动刷新按钮（侧栏 / 设置 刷新目录）
function doRefresh() {
  if (!ghEnabled()) { toast("请先在 ⚙ 设置 配置 GitHub 仓库"); openSettings(); return; }
  ghStatusMsg("正在从 GitHub 刷新目录…");
  refreshFromRepo().then(function (info) {
    ghStatusMsg("刷新完成：仓库目录 " + info.total + " 条路线" + (info.newFiles ? "，新拉取数据 " + info.newFiles + " 条" : ""));
  }).catch(function (e) {
    ghStatusMsg("刷新失败：" + (e && e.message ? e.message : "未知错误"));
  });
}
// 把 v5 前存于 localStorage 的旧路线逐条写入仓库（一次性迁移）
function migrateLegacy() {
  var arr = legacyRoutes();
  if (!arr.length) { toast("没有需要迁移的旧路线（localStorage 无历史路线）"); return; }
  if (!ghEnabled()) { toast("请先在 ⚙ 设置 配置 GitHub 仓库"); openSettings(); return; }
  if (!ghNeedToken()) { toast("迁移需要 GitHub Token"); openSettings(); return; }
  ghStatusMsg("正在迁移 " + arr.length + " 条旧路线到仓库…");
  arr.reduce(function (p, r) {
    return p.then(function () {
      try { normalizeRoute(r); } catch (e2) {}
      ROUTE_PACKS[r.id] = r;
      catUpsert({ id: r.id, name: r.name, file: "routes/" + r.id + ".js", days: routeDays(r), n: (r.stops || []).length, color: routeColorOf(r.id, r) });
      return ghWrite("routes/" + r.id + ".js", routeFileText(r), "route: migrate " + r.name);
    });
  }, Promise.resolve()).then(function () {
    return pushCatalog("route: migrate legacy");
  }).then(function () {
    store.routes = [];
    saveStore();
    rebuildMeta(); rebuildRouteList(); persistCache();
    ghStatusMsg("迁移完成：" + arr.length + " 条旧路线已写入仓库并清空本地旧库");
  }).catch(function (e) {
    ghStatusMsg("迁移失败：" + (e && e.message ? e.message : "未知错误"));
  });
}
function ghStatusMsg(s) { toast(s, 4200); }
// 保存 GitHub Token / 仓库配置（路线真源仓库）
function ghSaveConfig() {
  var cur = store.gh || {};
  cur.repo = (cur.repo || "").trim() || GH_DEFAULT_REPO;
  cur.branch = (cur.branch || "").trim() || GH_DEFAULT_BRANCH;
  cur.token = $("ghToken").value.trim();
  store.gh = cur;
  saveStore();
  var rl = $("ghRepoLabel"); if (rl) rl.innerHTML = esc(cur.repo) + " <b>✎</b>";
  if (cur.token) {
    toast("GitHub Token 已保存，正在刷新目录…");
    if (ghEnabled()) refreshFromRepo().catch(function () {});
  } else {
    toast("已清除 Token（可浏览仓库路线，但保存/删除需 Token）");
  }
}
$("ghSave").addEventListener("click", ghSaveConfig);
// 点击仓库名可修改（支持 owner/repo 或 owner/repo@分支）
var ghRepoEl = $("ghRepoLabel"); if (ghRepoEl) ghRepoEl.addEventListener("click", function () {
  var cur = store.gh || {};
  var old = (cur.repo || GH_DEFAULT_REPO) + (cur.branch && cur.branch !== "main" ? "@" + cur.branch : "");
  var v = prompt("路线仓库（owner/repo），分支非 main 用 owner/repo@分支：", old);
  if (!v) return;
  v = v.trim();
  var br = GH_DEFAULT_BRANCH, rp = v;
  var at = v.lastIndexOf("@");
  if (at > 0 && v.indexOf("/") < at) { rp = v.slice(0, at); br = v.slice(at + 1); }
  if (rp.indexOf("/") <= 0) { toast("格式应为 owner/repo"); return; }
  store.gh = store.gh || {};
  store.gh.repo = rp;
  store.gh.branch = br || GH_DEFAULT_BRANCH;
  saveStore();
  if (ghRepoEl) ghRepoEl.innerHTML = esc(rp) + " <b>✎</b>";
  toast("路线仓库已改为 " + rp + (br && br !== "main" ? "@" + br : ""));
});

/* ---------- 导入 / 导出（v6：编辑器弹窗已移除，导出入口迁移到 ⚙ 设置面板未来再做） ---------- */
// v6：原 edExport / edImport DOM 已移除，下方事件源改成 #fileImport，由「导入备份」入口触发
//   （v5 弹窗导入仍保留，按钮放置在 ⚙ 设置面板未来版本；此处仅保留 fileImport change 监听）
$("fileImport").addEventListener("change", function () {
  var f = this.files && this.files[0];
  this.value = "";
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var o = JSON.parse(rd.result);
      var arr = (o && o.routes) || [];
      if (!arr.length) { toast("文件中没有路线数据"); return; }
      if (!ghEnabled()) { toast("导入的路线将写入 GitHub 仓库，请先在 ⚙ 设置 配置仓库"); openSettings(); return; }
      if (!ghNeedToken()) { toast("导入路线需要 GitHub Token"); openSettings(); return; }
      var valid = [];
      arr.forEach(function (r) {
        if (!r || !Array.isArray(r.stops) || !r.stops.length) return;
        try { r.id = r.id || newId(); normalizeRoute(r); valid.push(r); } catch (e2) {}
      });
      if (!valid.length) { toast("文件中没有可导入的路线"); return; }
      ghStatusMsg("正在导入 " + valid.length + " 条路线到仓库…");
      valid.reduce(function (p, r) {
        return p.then(function () {
          ROUTE_PACKS[r.id] = r;
          catUpsert({ id: r.id, name: r.name, file: "routes/" + r.id + ".js", days: routeDays(r), n: (r.stops || []).length, color: routeColorOf(r.id, r) });
          return ghWrite("routes/" + r.id + ".js", routeFileText(r), "route: import " + r.name);
        });
      }, Promise.resolve()).then(function () { return pushCatalog("route: import"); })
        .then(function () { rebuildMeta(); rebuildRouteList(); persistCache(); ghStatusMsg("导入完成：" + valid.length + " 条路线已写入仓库"); })
        .catch(function (e) { ghStatusMsg("导入失败：" + (e && e.message ? e.message : "未知错误")); });
    } catch (e) { toast("导入失败：文件格式不正确"); }
  };
  rd.readAsText(f);
});

/* ---------- 启动：并入离线缓存（只读副本）；已配置 Token 则自动从仓库刷新目录 ---------- */

applyCache();
rebuildRouteList();
applyEditMode(); // v6.4：初始按 edCtx.editMode=false（视图模式）设置 .info-panel .editing 类与「编辑中」徽标隐藏
applyMobileReadOnly(); // v6.18：手机/平板 → body.is-mobile，编辑入口隐藏且恒为只读
// 输入方式变化时重新判定（旋转屏幕、外接 / 拔掉鼠标改变主指针）
if (_mqCoarse && _mqCoarse.addEventListener) _mqCoarse.addEventListener("change", applyMobileReadOnly);
// 不预载/默认渲染任何内置路线：首屏为主页画廊，点卡片时才按需加载 routes/*.js（见 enterRoute → ensureRouteData）

/* ========== 主页（路线库画廊） ========== */
function routeCardMeta(id) {
  // 所有路线同一来源：目录登记；优先取已加载数据算实际天数，未加载用目录元信息（卡片先展示，点开才拉数据）
  var cat = catGet(id);
  if (!cat) return null;
  var pk = ROUTE_PACKS[id];
  var days = cat.days || 1;
  if (pk && pk.stops && pk.stops.length) {
    var mx = 1;
    pk.stops.forEach(function (s) { if ((s.day || 1) > mx) mx = s.day; });
    days = mx;
  }
  return { name: cat.name, days: days, season: cat.season || "" };
}
/* v6.6 四季画廊：春夏秋冬四个板块从上到下；路线归属读 catalog 条目的 season 字段（未登记 → 春，待后续规划）
   v6.18.2：原 ico 字段（春夏秋冬花朵/太阳/落叶/雪花 emoji）从未被 renderHome 使用（渲染只用 name/en），属死数据且是彩色 emoji → 直接删除 */
var SEASON_ORDER = [
  { key: "spring", name: "春", en: "Spring" },
  { key: "summer", name: "夏", en: "Summer" },
  { key: "autumn", name: "秋", en: "Autumn" },
  { key: "winter", name: "冬", en: "Winter" }
];
function renderHome() {
  var grid = $("homeGrid");
  var groups = {};
  SEASON_ORDER.forEach(function (s) { groups[s.key] = []; });
  var any = false;
  ROUTE_META.forEach(function (m) {
    if (String(m.id).indexOf("__pv") >= 0) return; // 预览占位不展示
    var meta = routeCardMeta(m.id);
    if (!meta) return;
    any = true;
    var sk = groups[meta.season] ? meta.season : "spring";
    // 行程时长：X 天 X 晚（中文行程标准写法，nights = days - 1）
    var nights = Math.max(0, meta.days - 1);
    groups[sk].push('<div class="home-card" data-route="' + m.id + '">' +
      '<div class="nm">' + esc(meta.name) + "</div>" +
      '<div class="meta">' + meta.days + " 天 " + nights + " 晚</div>" +
      "</div>");
  });
  if (!any) {
    grid.innerHTML = '<div class="home-empty">暂无可进入的路线。点右上「＋ 新建」创建，保存后写入 GitHub 仓库。</div>';
    return;
  }
  var html = SEASON_ORDER.map(function (s) {
    var cards = groups[s.key];
    var body = cards.length ? cards.join("") : '<div class="season-empty">静待规划</div>';
    return '<section class="season">' +
      '<div class="season-head"><span class="nm">' + s.name + '<i>' + s.en + '</i></span>' +
      '<span class="cnt">' + cards.length + ' 条</span></div>' +
      '<div class="season-cards">' + body + "</div></section>";
  }).join("");
  grid.innerHTML = html;
  scheduleHomeFade();
  applyLiquidGlassAll();
}
/* v6.6 主页渐隐（JS 驱动，比 scroll-driven animation 更可控）；
   v6.14 重排：出场带 24%→12%（原 40%→12%，上滑一半距离即完全隐藏）；
   v6.15 入场改为底部固定渐隐带：顶部出场效果的镜像，带固定在视口内、不随季节走：
   前板块下方便开始渐隐，尾板块初始全隐，上滑时升离雾带渐显；
   v6.15.1 入场与出场同速：带长 = 12vh，与出场带 24%→12% 同跨度同速率
   （v6.15 的 40px 行程用户反馈太快）。渐隐按板块顶缘驱动，前板块顶缘高出尾板块
   顶缘 = 前板块高 + 间距（854 视口 ≈173px）> 12vh，前板块不受雾带影响 */
var _homeFadeRaf = 0;
function applyHomeFade() {
  var sc = document.querySelector(".home-scroll");
  if (!sc) return;
  var vh = window.innerHeight || document.documentElement.clientHeight || 800;
  var fadeTop = vh * 0.24, fadeEnd = vh * 0.12; // 出场：24% 线起渐隐，12% 线（=容器顶缘）全隐
  var span = Math.max(1, fadeTop - fadeEnd);

}
(function initHomeFade() {

  if (!sc) return;
  sc.addEventListener("scroll", scheduleHomeFade, { passive: true });
  window.addEventListener("resize", scheduleHomeFade);
})();
/* ============================================================
 * v6.13 四季壁纸系统

 * 东八区按月份定季：春 3-5 / 夏 6-8 / 秋 9-11 / 冬 12-2，每分钟核验跨季自动切换；
 * 当季清单为空时回落到第一个有图的季节。点左上 logo 在当季壁纸间循环

/* ============================================================
 * v6.10 全元素边缘折射（液态玻璃透镜效应）
 * 所有玻璃元素（卡片/面板/弹窗/菜单/按钮）统一极轻边缘折射：
 * 圆角矩形 SDF → 位移贴图 → feDisplacementMap → backdrop-filter url()。

 * 尺寸变化：ResizeObserver 防抖重建（面板展开/弹窗打开）。
 * ============================================================ */
var _lgSeq = 0;

/* v6.18.1：WeakMap 没有 forEach —— 原 _lgMap.forEach 在 resize 时必抛 TypeError，

  var minWH = Math.min(w, h);
  var bendPx = Math.max(4, Math.min(LG.bendPx, Math.round(minWH * 0.35)));
  var bendAmp = isFour ? 4 : Math.max(2, Math.min(8, minWH * 0.045));

function applyLiquidGlassAll() {

window.addEventListener('resize', function () {

function showHome() {
  renderHome();
  $("homeMask").style.display = "";
  $("homeFab").style.display = "none";
  updateDocTitle(); // v6.18：回到主页 → 标题回落到平台名
}
function hideHome() {
  $("homeMask").style.display = "none";
  // 必须给具体值：#homeFab 基础样式是 display:none，置 "" 只会退回样式表 → 按钮永远不出现
  // （移动端 ⋯ 菜单被隐藏，⌂ 是唯一回主页入口，曾因此成为死路）
  $("homeFab").style.display = "inline-block";

/* ============================================================
 * v6.5.2 浏览器历史 / 返回键支持（hash 路由）
 * 状态模型：#/ 主页 · #/n 新建 · #/r/<id> 进入路线 · 各页面附加 /s 表示设置弹层
 * 规则：
 *   - UI 切换（点卡片/新建/设置/保存成功等）经 syncHash() 写入 history（带 _skipNextHash 防自触发）
 *   - 浏览器前进/后退 / 手改地址 触发 hashchange → applyHashLocation() 恢复对应视图

  if (!parts.length || parts[0] === "") { /* home */ }
  else if (parts[0] === "n") { st.page = "new"; }

$("homeMask").addEventListener("click", function (ev) {

$("homeFab").addEventListener("click", function () { location.hash = "#/"; });
$("homeNew").addEventListener("click", function () { location.hash = "#/n"; });
$("homeRefresh").addEventListener("click", function () { doRefresh(); });
// OSRM 未取到路径提示条内的「重试」（事件委托：提示条内容每次重建）
$("osrmNote").addEventListener("click", function (ev) {
  var b = ev.target.closest ? ev.target.closest(".osrm-retry") : null;
  if (b) osrmRetry();

// v6.5.2：设置改为直接覆盖在主页之上（z-index 3000 > homeMask 2400），不再 hideHome
$("homeSettings").addEventListener("click", function () { openSettings(); });
// 初始进入：展示主页画廊 + 侧栏显示"未选择路线"
showHome();
renderRouteHeader();
renderWpList();

// v6.5.2 补丁：首次加载（F5 刷新 / 从地址栏粘贴带 hash 的链接）不会触发 hashchange，
// 需主动按初始 hash 恢复视图：主页 #/、新建 #/n、路线 #/r/<id>、设置附加 /s
var _bootSt = parseHashState();
if (_bootSt.page !== "home" || _bootSt.settings) applyHashLocation();

ghInit().then(function (r) {
  if (r && !r.error && $("homeMask").style.display !== "none") renderHome();
});
